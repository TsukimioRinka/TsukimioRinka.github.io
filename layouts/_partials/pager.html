{{- if gt .TotalPages 1 }}
<nav class="pager" aria-label="分页">
    <span class="pager-slot">
        {{- with .Prev }}<a class="pager-link" href="{{ .URL }}" rel="prev">← 上一页</a>{{ end -}}
    </span>
    <span class="pager-count" aria-current="page">{{ .PageNumber }} / {{ .TotalPages }}</span>
    <span class="pager-slot pager-slot--next">
        {{- with .Next }}<a class="pager-link" href="{{ .URL }}" rel="next">下一页 →</a>{{ end -}}
    </span>
</nav>
{{- end }}
