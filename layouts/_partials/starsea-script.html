{{- /* 首页脚本：启动页（草坡、流星、风吹草）与星海（星空、时间之河、旅人）。
     Reduced motion: no loops at all — still stars, frozen meteor streaks, still grass,
     the traveler crossfades instead of flying, the splash leaves with a plain fade. */ -}}
<script>
(() => {
    const root = document.documentElement;
    const NS = window.NightSky;
    if (!NS) return;
    const { createSky, seeded, WARM } = NS;
    let calm = NS.isCalm();

    /* ================= splash ================= */
    const splash = document.getElementById('splash');
    let openSplash = null;
    let skipArrival = !root.classList.contains('splash-open');

    if (splash) {
        const land = splash.querySelector('.splash-land');
        const grassCanvas = splash.querySelector('.splash-grass');
        const head = splash.querySelector('.wanderer-head');
        const gctx = grassCanvas.getContext('2d');
        const hill = (x) => 335.6 - 0.18639 * x + 0.00011801 * x * x;

        let ascender = null;
        const sky = createSky(splash.querySelector('.splash-sky'), {
            seed: 3, density: 1700, skew: 1.2, yMax: 0.9, horizonFade: true,
            meteorEvery: [0.35, 1.5], meteorTop: 0.42, fireballs: 0.05, frozenMeteors: 3,
            band: (W, H) => ({
                pts: [{ x: -0.1 * W, y: 0.98 * H }, { x: 0.3 * W, y: 0.6 * H }, { x: 0.62 * W, y: 0.3 * H }, { x: 1.1 * W, y: -0.08 * H }],
                width: Math.max(W, H) * 0.15, glow: 0.024, dust: 1.4
            })
        });

        const rnd = seeded(5);
        const blades = [];
        for (let x = -8; x <= 1448; x += 3.1) {
            const near = Math.abs(x - 790) < 60 ? 5 : 0;
            blades.push({ x: x + (rnd() - 0.5) * 2, h: 5 + rnd() * 10 + near, lean: (rnd() - 0.5) * 5, w: 0.9 + rnd() * 0.8, ph: rnd() * 6.28 });
        }
        let gs = 1, gox = 0, goy = 0, gdpr = 1;
        const buildGrass = () => {
            gdpr = Math.min(window.devicePixelRatio || 1, 2);
            grassCanvas.width = Math.round(innerWidth * gdpr);
            grassCanvas.height = Math.round(innerHeight * gdpr);
            const b = land.getBoundingClientRect();
            gs = Math.max(b.width / 1440, b.height / 400);
            gox = b.left + (b.width - 1440 * gs) / 2;
            goy = b.bottom - 400 * gs;
        };
        const drawGrass = (t) => {
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.clearRect(0, 0, grassCanvas.width, grassCanvas.height);
            gctx.setTransform(gdpr * gs, 0, 0, gdpr * gs, gdpr * gox, gdpr * goy);
            gctx.fillStyle = '#0a1222';
            gctx.beginPath();
            const gust = 0.75 + 0.45 * Math.sin(t * 0.27);
            const x0 = -gox / gs - 12, x1 = (innerWidth - gox) / gs + 12;
            for (const b of blades) {
                if (b.x < x0 || b.x > x1) continue;
                const yb = hill(b.x) + 1.5;
                const sway = calm ? 0 : (Math.sin(t * 1.7 + b.x * 0.016 + b.ph * 0.3) * 1.7 + Math.sin(t * 0.6 + b.x * 0.004) * 1.5) * gust;
                const lx = b.lean + sway;
                gctx.moveTo(b.x - b.w, yb);
                gctx.quadraticCurveTo(b.x + lx * 0.35 - b.w * 0.2, yb - b.h * 0.55, b.x + lx, yb - b.h);
                gctx.quadraticCurveTo(b.x + lx * 0.35 + b.w * 0.5, yb - b.h * 0.5, b.x + b.w, yb);
                gctx.closePath();
            }
            gctx.fill();
        };

        /* the wanderer's light rising to "today" while the ground sinks */
        const drawAscender = (now) => {
            if (!ascender) return;
            const k = Math.min(1, (now - ascender.start) / ascender.dur);
            const e = 1 - Math.pow(1 - k, 2.2);
            const { a, c, b } = ascender;
            const u = 1 - e;
            const x = u * u * a.x + 2 * u * e * c.x + e * e * b.x;
            const y = u * u * a.y + 2 * u * e * c.y + e * e * b.y;
            ascender.trail.push({ x, y });
            if (ascender.trail.length > 26) ascender.trail.shift();
            const g = sky.ctx;
            g.globalCompositeOperation = 'lighter';
            ascender.trail.forEach((p, i) => {
                const f = (i + 1) / ascender.trail.length;
                const z = 4 + 22 * f;
                g.globalAlpha = 0.5 * f * (1 - k * 0.35);
                g.drawImage(WARM, p.x - z / 2, p.y - z / 2, z, z);
            });
            g.globalAlpha = 1;
            g.globalCompositeOperation = 'source-over';
            if (k >= 1) ascender = null;
        };

        let raf = 0, running = false, closing = false, last = 0, lastInput = 'pointer';
        const loop = (now) => {
            raf = 0;
            if (!running) return;
            const t = now / 1000, dt = Math.min(0.05, (now - last) / 1000 || 0.016);
            last = now;
            sky.frame(t, dt);
            drawAscender(now);
            drawGrass(t);
            raf = requestAnimationFrame(loop);
        };
        const build = () => {
            sky.build();
            buildGrass();
            sky.frame(0, 0);
            drawGrass(0);
        };

        const onKey = (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) return;
            lastInput = 'key';
            if (e.key === ' ' || e.key === 'Enter') e.preventDefault();
            close();
        };
        const onWheel = () => close();
        const onTouchMove = () => close();
        let rz = 0;
        const onResize = () => { clearTimeout(rz); rz = setTimeout(build, 120); };

        const close = () => {
            if (closing || !root.classList.contains('splash-open')) return;
            closing = true;
            try { sessionStorage.setItem('body:splash', 'seen'); } catch (e) { /* ignore */ }
            const viaKey = lastInput === 'key';
            const target = document.querySelector('#starsea .ttoday');
            if (!calm && head && target) {
                const h = head.getBoundingClientRect(), t = target.getBoundingClientRect();
                const a = { x: h.left + h.width / 2, y: h.top + h.height / 2 };
                const b = { x: t.left + t.width / 2, y: t.top + t.height / 2 };
                ascender = { a, b, c: { x: a.x + (b.x - a.x) * 0.15, y: Math.min(a.y, b.y) - 40 }, start: performance.now() + 120, dur: 1150, trail: [] };
            }
            root.classList.remove('splash-open');
            root.classList.add('splash-leaving');
            splash.classList.add('is-leaving');
            document.dispatchEvent(new CustomEvent('splash:leave'));
            document.removeEventListener('keydown', onKey, true);
            removeEventListener('wheel', onWheel);
            removeEventListener('touchmove', onTouchMove);
            setTimeout(() => {
                running = false;
                cancelAnimationFrame(raf); raf = 0;
                ascender = null;
                root.classList.remove('splash-leaving');
                splash.classList.remove('is-leaving');
                removeEventListener('resize', onResize);
                if (viaKey) {
                    const sea = document.getElementById('starsea');
                    if (sea) sea.focus({ preventScroll: true });
                }
            }, calm ? 650 : 1800);
        };

        openSplash = () => {
            closing = false;
            lastInput = 'pointer';
            splash.classList.remove('is-leaving');
            root.classList.add('splash-open');
            build();
            if (!calm && !running) { running = true; last = performance.now(); raf = requestAnimationFrame(loop); }
            splash.focus({ preventScroll: true });
            document.addEventListener('keydown', onKey, true);
            addEventListener('wheel', onWheel, { passive: true });
            addEventListener('touchmove', onTouchMove, { passive: true });
            addEventListener('resize', onResize);
        };

        splash.addEventListener('click', () => close());
        if (root.classList.contains('splash-open')) openSplash();
    }

    /* ================= star sea ================= */
    const sea = document.getElementById('starsea');
    if (!sea) return;
    sea.classList.add('is-live');

    const canvas = sea.querySelector('.starsea-sky');
    const stops = [...sea.querySelectorAll('[data-stop]')];
    const todayIdx = stops.length - 1;
    const traveler = sea.querySelector('.traveler');
    const flip = sea.querySelector('.traveler-flip');
    const note = sea.querySelector('.starsea-note');
    const nDate = note.querySelector('.note-date');
    const nAgo = note.querySelector('.note-ago');
    const nTitle = note.querySelector('.note-title');
    const nSummary = note.querySelector('.note-summary');
    const nGo = note.querySelector('.note-go');
    const nBack = note.querySelector('.note-back');
    const defaults = { title: nTitle.textContent, summary: nSummary.textContent };
    const narrow = matchMedia('(max-width: 700px)');
    const parse = (s) => (s || '').trim().split(/\s+/).map((p) => { const [x, y] = p.split(',').map(Number); return { x, y }; });
    const riverWide = parse(sea.dataset.river), riverNarrow = parse(sea.dataset.riverM);
    let river = narrow.matches ? riverNarrow : riverWide;
    let W = 1, H = 1;

    const riverAt = (t) => {
        const n = river.length - 1;
        const f = Math.max(0, Math.min(1, t)) * n;
        const i = Math.min(n - 1, Math.floor(f)), u = f - i;
        const p0 = river[Math.max(0, i - 1)], p1 = river[i], p2 = river[i + 1], p3 = river[Math.min(n, i + 2)];
        const cr = (a, b, c, d) => 0.5 * (2 * b + (c - a) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (3 * b - a - 3 * c + d) * u * u * u);
        return { x: cr(p0.x, p1.x, p2.x, p3.x) * W / 100, y: cr(p0.y, p1.y, p2.y, p3.y) * H / 100 };
    };
    const riverPath = (g, t0, t1, steps) => {
        g.beginPath();
        for (let s = 0; s <= steps; s++) {
            const p = riverAt(t0 + (t1 - t0) * s / steps);
            if (s) g.lineTo(p.x, p.y); else g.moveTo(p.x, p.y);
        }
    };
    /* extend the river past both ends so the Milky Way runs off-canvas */
    const bandPoints = (w, h) => {
        const pts = [];
        for (let s = 0; s <= 60; s++) { const p = riverAt(s / 60); pts.push({ x: p.x, y: p.y }); }
        const ext = (a, b, k) => ({ x: a.x + (a.x - b.x) * k, y: a.y + (a.y - b.y) * k });
        pts.unshift(ext(pts[0], pts[3], 6));
        pts.push(ext(pts[pts.length - 1], pts[pts.length - 4], 5));
        return { pts, width: Math.max(w, h) * 0.14, glow: 0.02, dust: 1.1 };
    };

    const sky = createSky(canvas, {
        seed: 9, density: 2400, skew: 1, meteorEvery: [1.0, 3.2], meteorTop: 0.4, fireballs: 0.06, frozenMeteors: 2,
        band: bandPoints,
        over: (g) => {
            g.save();
            g.lineCap = 'round'; g.lineJoin = 'round';
            riverPath(g, 0, 1, 160);
            g.strokeStyle = 'rgba(150,170,255,0.05)'; g.lineWidth = 26; g.stroke();
            g.strokeStyle = 'rgba(200,210,255,0.07)'; g.lineWidth = 9; g.stroke();
            g.setLineDash([1.5, 7]);
            g.strokeStyle = 'rgba(232,201,138,0.5)'; g.lineWidth = 1.2; g.stroke();
            g.restore();
        }
    });

    /* time flowing along the river, past → today */
    const flows = Array.from({ length: 14 }, (_, i) => ({ t: i / 14 + Math.random() * 0.05, sp: 0.03 + Math.random() * 0.02, a: 0.5 + Math.random() * 0.5 }));
    const drawFlows = (dt) => {
        const g = sky.ctx;
        g.globalCompositeOperation = 'lighter';
        for (const f of flows) {
            f.t += f.sp * dt;
            if (f.t > 1) f.t -= 1;
            const edge = Math.min(1, f.t * 10, (1 - f.t) * 10);
            const p = riverAt(f.t);
            g.globalAlpha = 0.55 * f.a * edge;
            g.drawImage(WARM, p.x - 7, p.y - 7, 14, 14);
        }
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
    };

    const sparks = [];
    const emit = (x, y, n, spread = 1) => {
        for (let i = 0; i < n; i++) {
            sparks.push({
                x: x + (Math.random() - 0.5) * 6, y: y + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 30 * spread, vy: (Math.random() - 0.5) * 30 * spread + 5,
                life: 0, ttl: 0.6 + Math.random() * 0.8, r: 0.6 + Math.random() * 1.5
            });
        }
        if (sparks.length > 260) sparks.splice(0, sparks.length - 260);
    };
    const drawSparks = (dt) => {
        const g = sky.ctx;
        g.globalCompositeOperation = 'lighter';
        const damp = Math.pow(0.15, dt);
        for (let i = sparks.length - 1; i >= 0; i--) {
            const s = sparks[i];
            s.life += dt;
            if (s.life >= s.ttl) { sparks.splice(i, 1); continue; }
            s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= damp; s.vy *= damp;
            const k = 1 - s.life / s.ttl;
            const z = s.r * 9;
            g.globalAlpha = k * 0.85;
            g.drawImage(WARM, s.x - z / 2, s.y - z / 2, z, z);
        }
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
    };

    /* ---------- the traveler ---------- */
    const FEET = 9;
    const tOf = (i) => parseFloat(stops[i].dataset.t) || 0;
    let curT = 1, curIdx = todayIdx, flight = null;
    const place = (t, lift = 0) => {
        const p = riverAt(t);
        traveler.style.transform = `translate3d(${p.x.toFixed(1)}px,${(p.y - FEET - lift).toFixed(1)}px,0)`;
        return p;
    };

    const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const ago = (iso) => {
        const [y, m, d] = iso.split('-').map(Number);
        const then = new Date(y, m - 1, d);
        const now = new Date();
        const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - then) / 86400000);
        let txt;
        if (days <= 0) txt = '就在今天';
        else if (days === 1) txt = '昨天';
        else if (days < 31) txt = `${days} 天前`;
        else if (days < 365) txt = `${Math.round(days / 30.44)} 个月前`;
        else {
            const yy = Math.floor(days / 365.25), mm = Math.round((days - yy * 365.25) / 30.44);
            txt = mm ? `${yy} 年 ${mm} 个月前` : `${yy} 年前`;
        }
        return `${txt} · ${WEEK[then.getDay()]}`;
    };
    let noteTimer = 0;
    const renderNote = (stop) => {
        const fill = () => {
            if (stop.dataset.stop === 'today') {
                const now = new Date();
                nDate.textContent = '今天';
                nAgo.textContent = `${now.getMonth() + 1} 月 ${now.getDate()} 日 · ${WEEK[now.getDay()]}`;
                nTitle.textContent = defaults.title;
                nSummary.textContent = defaults.summary;
                nGo.hidden = true;
                nBack.hidden = true;
            } else {
                nDate.textContent = stop.dataset.date;
                nAgo.textContent = ago(stop.dataset.iso);
                const a = document.createElement('a');
                a.href = stop.getAttribute('href');
                a.textContent = stop.dataset.title;
                nTitle.replaceChildren(a);
                nSummary.textContent = stop.dataset.summary || '';
                nGo.href = stop.getAttribute('href');
                nGo.hidden = false;
                nBack.hidden = false;
            }
            note.classList.remove('is-swap');
        };
        clearTimeout(noteTimer);
        if (calm) { fill(); return; }
        note.classList.add('is-swap');
        noteTimer = setTimeout(fill, 150);
    };
    const arrive = (i) => {
        curIdx = i;
        stops.forEach((s, j) => s.classList.toggle('is-current', j === i));
        renderNote(stops[i]);
    };

    let raf = 0, last = 0, visible = true;
    const busy = () => flight || sparks.length;
    const loop = (now) => {
        raf = 0;
        if (!visible || document.hidden) return;
        const t = now / 1000, dt = Math.min(0.05, (now - last) / 1000 || 0.016);
        last = now;
        if (flight) stepFlight(now);
        sky.frame(t, dt);
        if (!calm) drawFlows(dt);
        drawSparks(dt);
        if (!calm || busy()) raf = requestAnimationFrame(loop);
    };
    const kick = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } };

    const stepFlight = (now) => {
        const k = Math.min(1, Math.max(0, (now - flight.start) / flight.dur));
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        curT = flight.from + (flight.to - flight.from) * e;
        const lift = Math.sin(Math.PI * k) * 18;
        const p = place(curT, lift);
        emit(p.x, p.y - FEET - lift - 12, 2, 0.6);
        if (k >= 1) {
            const i = flight.i;
            flight = null;
            traveler.classList.remove('is-flying');
            emit(p.x, p.y - 3, 16, 1.4);
            arrive(i);
        }
    };

    const flyTo = (i) => {
        if (i < 0 || i > todayIdx) return;
        if (flight && flight.i === i) return;
        if (!flight && i === curIdx) { arrive(i); return; }
        const to = tOf(i);
        if (calm) {
            traveler.classList.add('is-hidden');
            setTimeout(() => {
                curT = to;
                place(curT);
                traveler.classList.remove('is-hidden');
                arrive(i);
            }, 200);
            return;
        }
        const a = riverAt(curT), b = riverAt(to);
        if (Math.abs(b.x - a.x) > 2) flip.classList.toggle('is-left', b.x < a.x);
        flight = { from: curT, to, i, start: performance.now(), dur: 700 + 1300 * Math.min(1, Math.abs(to - curT)) };
        traveler.classList.add('is-flying');
        kick();
    };

    /* ---------- input ---------- */
    let lastPointer = 'mouse', hoverTimer = 0, quietUntil = 0;
    const hush = (ms = 14000) => { quietUntil = performance.now() + ms; };
    sea.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType || 'mouse'; hush(); }, { passive: true });
    sea.addEventListener('pointermove', () => hush(), { passive: true });
    sea.addEventListener('keydown', () => { lastPointer = 'key'; hush(); });

    stops.forEach((s, i) => {
        s.addEventListener('pointerenter', (e) => {
            if (e.pointerType !== 'mouse') return;
            clearTimeout(hoverTimer);
            hoverTimer = setTimeout(() => flyTo(i), 90);
        });
        s.addEventListener('pointerleave', () => clearTimeout(hoverTimer));
        s.addEventListener('focus', () => { if (lastPointer === 'key') flyTo(i); });
        s.addEventListener('click', (e) => {
            if (s.dataset.stop === 'today') { flyTo(i); return; }
            /* touch: first tap travels there, the second tap (or the caption link) opens it */
            if (lastPointer !== 'mouse' && lastPointer !== 'key' && curIdx !== i) { e.preventDefault(); flyTo(i); }
        });
        s.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
                const next = stops[i + (e.key === 'ArrowLeft' ? -1 : 1)];
                if (next) next.focus();
            } else if (e.key === 'Escape') {
                stops[todayIdx].focus();
                flyTo(todayIdx);
            }
        });
    });
    nBack.addEventListener('click', () => { flyTo(todayIdx); hush(); });

    /* left alone, the traveler drifts back through time, one star at a time */
    if (stops.length > 1) {
        setInterval(() => {
            if (calm || !visible || document.hidden || flight || performance.now() < quietUntil) return;
            if (sea.contains(document.activeElement) && document.activeElement !== sea) return;
            let j = curIdx === todayIdx ? todayIdx - 1 : curIdx - 1;
            if (j < 0) j = todayIdx;
            flyTo(j);
        }, 8500);
    }

    /* ---------- layout ---------- */
    const layout = () => {
        const r = sea.getBoundingClientRect();
        if (Math.abs(r.width - W) < 1 && Math.abs(r.height - H) < 1 && sky.st.W > 1) return;
        W = r.width; H = r.height;
        river = narrow.matches ? riverNarrow : riverWide;
        sky.build();
        sky.frame(performance.now() / 1000, 0);
        if (!flight) place(curT);
    };
    let rz = 0;
    addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 140); });
    layout();
    renderNote(stops[todayIdx]);

    if ('IntersectionObserver' in window) {
        new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) kick(); }, { threshold: 0.02 }).observe(sea);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });

    /* ---------- arrival ---------- */
    const wake = (delay) => {
        traveler.classList.add('is-hidden');
        sea.classList.add('is-awake');
        setTimeout(() => {
            traveler.classList.remove('is-hidden');
            const p = riverAt(curT);
            emit(p.x, p.y - FEET - 14, calm ? 0 : 22, 1.6);
            kick();
        }, delay);
    };
    if (skipArrival) wake(calm ? 0 : 500);
    else document.addEventListener('splash:leave', () => wake(calm ? 0 : 1250), { once: true });
    kick();

    addEventListener('motionchange', () => {
        calm = NS.isCalm();
        sky.build();
        sky.frame(performance.now() / 1000, 0);
        if (calm) { flight = null; traveler.classList.remove('is-flying'); place(curT); }
        kick();
    });

    const back = sea.querySelector('.starsea-back');
    if (openSplash && back) {
        back.hidden = false;
        back.addEventListener('click', () => {
            sea.classList.remove('is-awake');
            skipArrival = false;
            document.addEventListener('splash:leave', () => wake(calm ? 0 : 1250), { once: true });
            openSplash();
        });
    }
})();
</script>
