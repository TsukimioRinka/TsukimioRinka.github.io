<header class="header">
    <div class="header-nav">
        <a class="brand" href="{{ "" | absLangURL }}" accesskey="h" title="{{ site.Title }} (Alt + H)" aria-label="{{ site.Title }} — 首页">
            <span class="brand-name">{{ site.Title }}</span><span class="brand-dot" aria-hidden="true">。</span>
        </a>

        <nav class="site-nav" aria-label="主导航">
            <ul id="menu" class="menu">
                {{- $current := .RelPermalink }}
                {{- range site.Menus.main }}
                {{- $url := .URL | relLangURL }}
                {{- $active := or (eq $current $url) (and (ne $url "/") (hasPrefix $current $url)) }}
                <li>
                    <a href="{{ $url }}"{{ if $active }} class="active" aria-current="page"{{ end }}{{ if eq .URL "/search/" }} accesskey="/" title="搜索 (Alt + /)"{{ end }}>{{ .Name }}</a>
                </li>
                {{- end }}
            </ul>
        </nav>

        {{- if (not site.Params.disableThemeToggle) }}
        <button id="theme-toggle" class="theme-toggle" accesskey="t" title="切换深浅色 (Alt + T)" aria-label="切换深浅色">
            <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <circle cx="12" cy="12" r="4.5"></circle>
                <line x1="12" y1="1.5" x2="12" y2="3.5"></line>
                <line x1="12" y1="20.5" x2="12" y2="22.5"></line>
                <line x1="4.4" y1="4.4" x2="5.8" y2="5.8"></line>
                <line x1="18.2" y1="18.2" x2="19.6" y2="19.6"></line>
                <line x1="1.5" y1="12" x2="3.5" y2="12"></line>
                <line x1="20.5" y1="12" x2="22.5" y2="12"></line>
                <line x1="4.4" y1="19.6" x2="5.8" y2="18.2"></line>
                <line x1="18.2" y1="5.8" x2="19.6" y2="4.4"></line>
            </svg>
        </button>
        {{- end }}
    </div>
</header>
