{{- /* 夜空画布库 + 全站星空。
     window.NightSky.createSky(canvas, opt) 被全站背景、启动页、首页星海共用。
     全站背景：.sky 里两块画布——.sky-still（静止星场与淡银河，滚动时轻微视差）
     与 .sky-canvas（闪烁星、流星）。CSS 星点只在没有 JS 时出现。
     动效安静（html.calm）时：没有任何循环，星不闪，流星定格成几道静止光痕。 */ -}}
<script>
(() => {
    const root = document.documentElement;
    const isCalm = () => !!(window.bodyMotion && window.bodyMotion.calm());

    const seeded = (seed) => () => {
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const glowSprite = (rgb, mid = 0.42) => {
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const g = c.getContext('2d');
        const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        r.addColorStop(0, `rgba(${rgb},1)`);
        r.addColorStop(0.22, `rgba(${rgb},${mid})`);
        r.addColorStop(1, `rgba(${rgb},0)`);
        g.fillStyle = r;
        g.fillRect(0, 0, 64, 64);
        return c;
    };
    const WARM = glowSprite('255,236,196');
    const COOL = glowSprite('205,220,255');
    const GOLD = glowSprite('255,206,120', 0.5);

    /* opt: seed, density, maxStars, skew, yMax, horizonFade, band(W,H), over(g,W,H),
       meteorEvery [a,b] seconds, meteorTop, meteorAlpha, fireballs, frozenMeteors,
       still (canvas for the static layer, drawn once), stillExtra (taller still layer for parallax),
       offsetY() (parallax shift applied to twinkles) */
    const createSky = (canvas, opt) => {
        const ctx = canvas.getContext('2d');
        const st = { W: 1, H: 1, dpr: 1 };
        let layer = null, twinklers = [], meteors = [], debris = [], nextMeteor = 0;

        const dot = (g, s, a) => {
            g.fillStyle = `rgba(${s.c},${a.toFixed(3)})`;
            if (s.r < 0.75) { g.fillRect(s.x, s.y, s.r * 1.7, s.r * 1.7); return; }
            g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832); g.fill();
            if (s.r > 1.2) {
                g.globalAlpha = a * 0.55;
                const z = s.r * 9;
                g.drawImage(s.warm ? WARM : COOL, s.x - z / 2, s.y - z / 2, z, z);
                g.globalAlpha = 1;
            }
        };
        const spikes = (g, s, a) => {
            const L = s.r * 7;
            g.strokeStyle = `rgba(${s.c},${(a * 0.5).toFixed(3)})`;
            g.lineWidth = 0.6;
            g.beginPath();
            g.moveTo(s.x - L, s.y); g.lineTo(s.x + L, s.y);
            g.moveTo(s.x, s.y - L); g.lineTo(s.x, s.y + L);
            g.stroke();
        };

        const paintBand = (g, band, rnd) => {
            const pts = band.pts;
            const seg = [];
            let len = 0;
            for (let i = 1; i < pts.length; i++) {
                const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
                seg.push(d); len += d;
            }
            if (!len) return;
            const at = (s) => {
                let i = 0;
                while (i < seg.length - 1 && s > seg[i]) { s -= seg[i]; i++; }
                const a = pts[i], b = pts[i + 1], k = seg[i] ? s / seg[i] : 0;
                const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
                return { x: a.x + dx * k, y: a.y + dy * k, nx: -dy / l, ny: dx / l };
            };
            const w = band.width;
            g.save();
            g.globalCompositeOperation = 'lighter';
            for (let i = 0, n = Math.round(len / 8); i < n; i++) {
                const p = at(rnd() * len);
                const off = (rnd() + rnd() + rnd() - 1.5) * w * 0.5;
                const x = p.x + p.nx * off, y = p.y + p.ny * off;
                const r = w * (0.22 + rnd() * 0.5);
                const c = rnd() < 0.3 ? '255,214,170' : rnd() < 0.55 ? '150,166,255' : '186,160,240';
                const gr = g.createRadialGradient(x, y, 0, x, y, r);
                gr.addColorStop(0, `rgba(${c},${(band.glow * (0.6 + rnd() * 0.8)).toFixed(3)})`);
                gr.addColorStop(1, `rgba(${c},0)`);
                g.fillStyle = gr;
                g.fillRect(x - r, y - r, r * 2, r * 2);
            }
            for (let i = 0, n = Math.round(len * band.dust); i < n; i++) {
                const p = at(rnd() * len);
                const off = (rnd() + rnd() + rnd() + rnd() - 2) * w * 0.3;
                const s = 0.4 + rnd() * 0.75;
                g.fillStyle = `rgba(232,236,255,${(0.12 + rnd() * 0.45).toFixed(2)})`;
                g.fillRect(p.x + p.nx * off, p.y + p.ny * off, s, s);
            }
            g.restore();
            g.save();
            g.globalCompositeOperation = 'destination-out';
            for (let i = 0, n = Math.round(len / 34); i < n; i++) {
                const p = at(rnd() * len);
                const off = (rnd() - 0.5) * w * 0.22;
                const r = w * (0.07 + rnd() * 0.14);
                const x = p.x + p.nx * off, y = p.y + p.ny * off;
                const gr = g.createRadialGradient(x, y, 0, x, y, r);
                gr.addColorStop(0, 'rgba(0,0,0,0.4)');
                gr.addColorStop(1, 'rgba(0,0,0,0)');
                g.fillStyle = gr;
                g.fillRect(x - r, y - r, r * 2, r * 2);
            }
            g.restore();
        };

        const drawMeteor = (m, g, alpha) => {
            const tx = m.x - m.dx * m.len, ty = m.y - m.dy * m.len;
            const head = m.fire ? '255,232,186' : '255,250,236';
            const tail = m.fire ? '255,190,110' : '200,214,255';
            /* soft outer tail, then the bright thin core */
            let gr = g.createLinearGradient(m.x, m.y, tx, ty);
            gr.addColorStop(0, `rgba(${tail},${(alpha * 0.28).toFixed(3)})`);
            gr.addColorStop(1, `rgba(${tail},0)`);
            g.strokeStyle = gr;
            g.lineWidth = m.w * 3.2;
            g.lineCap = 'round';
            g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(tx, ty); g.stroke();
            gr = g.createLinearGradient(m.x, m.y, tx, ty);
            gr.addColorStop(0, `rgba(${head},${alpha.toFixed(3)})`);
            gr.addColorStop(0.22, `rgba(${tail},${(alpha * 0.55).toFixed(3)})`);
            gr.addColorStop(1, `rgba(${tail},0)`);
            g.strokeStyle = gr;
            g.lineWidth = m.w;
            g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(tx, ty); g.stroke();
            const z = m.fire ? 34 : 20;
            g.globalAlpha = alpha;
            g.drawImage(m.fire ? GOLD : WARM, m.x - z / 2, m.y - z / 2, z, z);
            g.globalAlpha = 1;
        };
        const newMeteor = (rnd = Math.random, fire = false) => {
            const { W, H } = st;
            const leftward = rnd() < 0.7;
            const ang = 0.32 + rnd() * 0.5;
            const k = Math.sqrt(Math.max(0.4, W / 1440));
            return {
                x: W * (leftward ? 0.25 + rnd() * 0.85 : -0.1 + rnd() * 0.7),
                y: H * (-0.05 + rnd() * (opt.meteorTop || 0.45)),
                dx: (leftward ? -1 : 1) * Math.cos(ang), dy: Math.sin(ang),
                v: (fire ? 520 + rnd() * 260 : 780 + rnd() * 900) * k,
                len: (fire ? 260 + rnd() * 160 : 90 + rnd() * 220) * k,
                w: fire ? 2.2 : 0.9 + rnd() * 1.3,
                life: 0, ttl: fire ? 1.5 + rnd() * 0.6 : 0.45 + rnd() * 0.65,
                fire
            };
        };

        const build = () => {
            const r = canvas.getBoundingClientRect();
            st.W = Math.max(1, r.width); st.H = Math.max(1, r.height);
            st.dpr = Math.min(window.devicePixelRatio || 1, 2);
            const { W, H, dpr } = st;
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
            const LH = H * (1 + (opt.stillExtra || 0));
            if (opt.still) {
                layer = opt.still;
                layer.style.width = W + 'px';
                layer.style.height = LH + 'px';
            } else {
                layer = document.createElement('canvas');
            }
            layer.width = Math.round(W * dpr); layer.height = Math.round(LH * dpr);
            const g = layer.getContext('2d');
            g.setTransform(dpr, 0, 0, dpr, 0, 0);
            const calm = isCalm();
            const rnd = seeded(opt.seed || 7);
            if (opt.band) paintBand(g, opt.band(W, LH), rnd);
            twinklers = [];
            const count = Math.min(opt.maxStars || 1100, Math.round(W * LH / (opt.density || 2200)));
            for (let i = 0; i < count; i++) {
                const y = LH * Math.pow(rnd(), opt.skew || 1) * (opt.yMax || 1);
                const m = rnd();
                const s = {
                    x: rnd() * W, y,
                    r: m < 0.72 ? 0.35 + rnd() * 0.45 : m < 0.95 ? 0.8 + rnd() * 0.55 : 1.3 + rnd() * 0.9,
                    warm: false, c: '234,240,255', a: 0
                };
                const hue = rnd();
                if (hue > 0.62) { s.warm = hue < 0.86; s.c = s.warm ? '255,238,206' : '190,208,255'; }
                s.a = (0.32 + rnd() * 0.62) * (opt.horizonFade ? Math.min(1, 1.3 - y / LH) : 1);
                if (!calm && s.r > 0.85 && rnd() < 0.55) {
                    s.sp = 0.5 + rnd() * 1.7; s.ph = rnd() * 6.283;
                    twinklers.push(s);
                } else {
                    dot(g, s, s.a);
                    if (s.r > 1.75) spikes(g, s, s.a);
                }
            }
            if (opt.over) opt.over(g, W, LH);
            if (calm && opt.frozenMeteors) {
                const fr = seeded((opt.seed || 7) + 31);
                for (let i = 0; i < opt.frozenMeteors; i++) drawMeteor(newMeteor(fr), g, 0.7 * (opt.meteorAlpha || 1));
            }
            meteors = [];
            debris = [];
            nextMeteor = 0;
        };

        const frame = (t, dt) => {
            const { dpr, H } = st;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!opt.still && layer) ctx.drawImage(layer, 0, 0);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (isCalm()) return;
            const oy = opt.offsetY ? opt.offsetY() : 0;
            ctx.globalCompositeOperation = 'lighter';
            for (const s of twinklers) {
                const y = s.y - oy;
                if (y < -10 || y > H + 10) continue;
                const a = s.a * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
                const p = { x: s.x, y, r: s.r, c: s.c, warm: s.warm };
                dot(ctx, p, a);
                if (s.r > 1.6) spikes(ctx, p, a);
            }
            if (opt.meteorEvery) {
                if (!nextMeteor) nextMeteor = t + 0.5 + Math.random();
                if (t >= nextMeteor) {
                    const fire = opt.fireballs && Math.random() < opt.fireballs;
                    meteors.push(newMeteor(Math.random, fire));
                    if (!fire && Math.random() < 0.2) { const m = newMeteor(); m.life = -0.18 - Math.random() * 0.3; meteors.push(m); }
                    const [a, b] = opt.meteorEvery;
                    nextMeteor = t + a + Math.random() * (b - a);
                }
                const ma = opt.meteorAlpha || 1;
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.life += dt;
                    if (m.life < 0) continue;
                    if (m.life >= m.ttl) { meteors.splice(i, 1); continue; }
                    m.x += m.dx * m.v * dt; m.y += m.dy * m.v * dt;
                    const env = Math.pow(Math.sin(Math.PI * m.life / m.ttl), 0.7);
                    drawMeteor(m, ctx, env * ma);
                    if (m.fire && Math.random() < 0.6) {
                        debris.push({ x: m.x, y: m.y, vx: m.dx * 40 + (Math.random() - 0.5) * 30, vy: m.dy * 40 + 18 + Math.random() * 20, life: 0, ttl: 0.5 + Math.random() * 0.6 });
                    }
                }
                for (let i = debris.length - 1; i >= 0; i--) {
                    const d = debris[i];
                    d.life += dt;
                    if (d.life >= d.ttl) { debris.splice(i, 1); continue; }
                    d.x += d.vx * dt; d.y += d.vy * dt;
                    ctx.globalAlpha = (1 - d.life / d.ttl) * 0.8 * ma;
                    ctx.drawImage(GOLD, d.x - 4, d.y - 4, 8, 8);
                }
                ctx.globalAlpha = 1;
            }
            ctx.globalCompositeOperation = 'source-over';
        };

        return { build, frame, ctx, st };
    };

    window.NightSky = { createSky, seeded, glowSprite, WARM, COOL, GOLD, isCalm };

    /* ---------- the site-wide sky ---------- */
    const sky = document.querySelector('.sky');
    if (!sky || !window.requestAnimationFrame) return;
    const still = document.createElement('canvas');
    still.className = 'sky-canvas sky-still';
    const live = document.createElement('canvas');
    live.className = 'sky-canvas';
    still.setAttribute('aria-hidden', 'true');
    live.setAttribute('aria-hidden', 'true');
    sky.append(still, live);

    const reading = () => !!document.querySelector('.post-single');
    let shift = 0;
    const opts = {
        seed: 21, density: 2300, maxStars: 1000, skew: 1, stillExtra: 0.25, still,
        meteorEvery: [0.8, 3.0], meteorTop: 0.55, fireballs: 0.06, frozenMeteors: 3,
        /* behind a long read the streaks stay, a little quieter */
        meteorAlpha: reading() ? 0.8 : 1,
        offsetY: () => shift,
        band: (W, H) => ({
            pts: [{ x: -0.15 * W, y: 0.92 * H }, { x: 0.35 * W, y: 0.55 * H }, { x: 0.7 * W, y: 0.28 * H }, { x: 1.15 * W, y: -0.05 * H }],
            width: Math.max(W, H) * 0.16, glow: 0.011, dust: 0.55
        })
    };
    const night = createSky(live, opts);

    let raf = 0, last = 0;
    const loop = (now) => {
        raf = 0;
        if (document.hidden || isCalm()) return;
        const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
        last = now;
        night.frame(now / 1000, dt);
        raf = requestAnimationFrame(loop);
    };
    const start = () => {
        if (!raf && !isCalm() && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(loop); }
    };
    const build = () => {
        night.build();
        night.frame(performance.now() / 1000, 0);
        root.classList.add('sky-live');
        start();
    };

    /* parallax: the still field drifts up a little as you scroll, never past its extra height */
    let ticking = false;
    const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
            ticking = false;
            shift = isCalm() ? 0 : Math.min(scrollY * 0.035, night.st.H * 0.25);
            still.style.transform = `translate3d(0,${(-shift).toFixed(1)}px,0)`;
        });
    };
    addEventListener('scroll', onScroll, { passive: true });

    let rz = 0, lastW = innerWidth, lastH = innerHeight;
    addEventListener('resize', () => {
        /* mobile toolbars change the height a little while scrolling: ignore that */
        if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 120) return;
        lastW = innerWidth; lastH = innerHeight;
        clearTimeout(rz); rz = setTimeout(build, 160);
    });
    addEventListener('motionchange', () => { build(); onScroll(); });
    document.addEventListener('visibilitychange', start);

    /* first paint first: build the sky right after it */
    requestAnimationFrame(() => setTimeout(() => {
        opts.meteorAlpha = reading() ? 0.8 : 1;
        build();
        onScroll();
    }, 0));
})();
</script>
