{{- /* 顶部轨道条：线描小火车，纯 SVG + CSS 动画，无外部资源。
     颜色全部走 CSS 变量，深浅色自动适配；整块为纯装饰，对读屏隐藏。
     在 hugo.yaml 里设 params.train: false 可关闭。 */ -}}
{{- if ne site.Params.train false }}
<div class="rail-strip" aria-hidden="true">
    <div class="rail-bed"></div>
    <svg class="rail-train" viewBox="0 0 136 46" xmlns="http://www.w3.org/2000/svg"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <g class="train-smoke" stroke="none">
            <circle cx="112.5" cy="4.5" r="1.6"></circle>
            <circle cx="112.5" cy="4.5" r="2.2"></circle>
            <circle cx="112.5" cy="4.5" r="2.8"></circle>
        </g>
        <!-- 车厢 -->
        <rect x="22" y="19" width="44" height="14" rx="1.5"></rect>
        <rect x="27" y="22.5" width="8" height="5"></rect>
        <rect x="41" y="22.5" width="8" height="5"></rect>
        <!-- 连接钩 -->
        <line x1="66" y1="28" x2="72" y2="28"></line>
        <!-- 车头：驾驶室、锅炉、烟囱、穹顶 -->
        <rect x="72" y="13" width="16" height="20"></rect>
        <rect x="75" y="16" width="7" height="6"></rect>
        <rect x="88" y="17" width="32" height="16" rx="2"></rect>
        <path d="M95.5 17 A3.5 3.5 0 0 1 102.5 17"></path>
        <rect x="109" y="7" width="7" height="10"></rect>
        <line x1="107" y1="7" x2="118" y2="7"></line>
        <!-- 排障器与车灯 -->
        <path d="M120 33 L131 39 L120 39"></path>
        <line x1="120" y1="24" x2="126" y2="24"></line>
        <circle class="train-lamp" cx="128" cy="24" r="2.3" stroke="none"></circle>
        <!-- 底盘线 -->
        <line x1="22" y1="33" x2="120" y2="33"></line>
        <!-- 车轮：车厢 2 + 车头 3 -->
        <g class="train-wheel" stroke-width="1.4">
            <circle cx="30" cy="36" r="4"></circle>
            <line x1="30" y1="32.8" x2="30" y2="39.2"></line>
            <line x1="26.8" y1="36" x2="33.2" y2="36"></line>
        </g>
        <g class="train-wheel" stroke-width="1.4">
            <circle cx="56" cy="36" r="4"></circle>
            <line x1="56" y1="32.8" x2="56" y2="39.2"></line>
            <line x1="52.8" y1="36" x2="59.2" y2="36"></line>
        </g>
        <g class="train-wheel" stroke-width="1.4">
            <circle cx="79" cy="36" r="4"></circle>
            <line x1="79" y1="32.8" x2="79" y2="39.2"></line>
            <line x1="75.8" y1="36" x2="82.2" y2="36"></line>
        </g>
        <g class="train-wheel" stroke-width="1.4">
            <circle cx="93" cy="36" r="4"></circle>
            <line x1="93" y1="32.8" x2="93" y2="39.2"></line>
            <line x1="89.8" y1="36" x2="96.2" y2="36"></line>
        </g>
        <g class="train-wheel" stroke-width="1.4">
            <circle cx="111" cy="36" r="4"></circle>
            <line x1="111" y1="32.8" x2="111" y2="39.2"></line>
            <line x1="107.8" y1="36" x2="114.2" y2="36"></line>
        </g>
    </svg>
</div>
{{- end }}
