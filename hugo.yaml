baseURL: "https://body.is-a.dev/"
title: "body"
theme: "PaperMod"

defaultContentLanguage: "zh"
locale: "zh-CN"
titleCaseStyle: "none"
enableRobotsTXT: true
disableKinds: ["RSS"]
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - JSON

params:
  env: production
  description: "随手记一些踩坑和想法。"
  author: "body"
  mainSections: ["posts"]
  DateFormat: "2006-01-02"
  defaultTheme: dark
  disableThemeToggle: true

  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  hideSummary: false
  comments: false

  footer:
    text: "晚安。愿你今晚也能看见星星。"

  homeInfoParams:
    Title: "技术备忘簿"
    headline: "随手记一些<br>踩坑和想法。"
    Content: "这里是我的备忘簿：写点技术笔记、踩过的坑，以及暂时想明白的事。"

  assets:
    theme_color: "#0a0e1c"
    msapplication_TileColor: "#0a0e1c"

  socialIcons:
    - name: github
      url: "https://github.com/TsukimioRinka"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 10
    - name: 归档
      url: /archives/
      weight: 20
    - name: 标签
      url: /tags/
      weight: 30
    - name: 搜索
      url: /search/
      weight: 40
    - name: 关于
      url: /about/
      weight: 50
